name: Validate DESIGN_INDEX and prepare grounded PRs

on:
  workflow_dispatch:
    inputs:
      trigger_path:
        description: Immutable DESIGN_INDEX input to validate
        required: true
        default: trigger/DESIGN_INDEX_gdweb-26357.md
        type: string
      force_full_audit:
        description: Ignore valid PASS attestations and call all 19 audit nodes
        required: true
        default: false
        type: boolean
      dry_run:
        description: Verify patches without publishing branches or PRs
        required: true
        default: true
        type: boolean
      create_prs:
        description: Publish verified patches as draft PRs
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  merge_group:
    types:
      - checks_requested

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: design-validation-workflow-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Audit isolated Sections and verify grounded patches
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: design-validation-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.trigger_path || 'repository' }}
      cancel-in-progress: false
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
      NVIDIA_CONTEXT_WINDOW_TOKENS: ${{ vars.NVIDIA_CONTEXT_WINDOW_TOKENS || '1000000' }}
      NVIDIA_MAX_INPUT_TOKENS: ${{ vars.NVIDIA_MAX_INPUT_TOKENS || '980000' }}
      NVIDIA_MAX_OUTPUT_TOKENS: ${{ vars.NVIDIA_MAX_OUTPUT_TOKENS || '4096' }}
      NVIDIA_ENABLE_THINKING: ${{ vars.NVIDIA_ENABLE_THINKING || 'false' }}
      NVIDIA_REASONING_BUDGET: ${{ vars.NVIDIA_REASONING_BUDGET || '0' }}
      NVIDIA_TEMPERATURE: ${{ vars.NVIDIA_TEMPERATURE || '1.0' }}
      NVIDIA_TOP_P: ${{ vars.NVIDIA_TOP_P || '0.95' }}
      NVIDIA_RPM_LIMIT: ${{ vars.NVIDIA_RPM_LIMIT || '40' }}
      NVIDIA_AUDIT_CONCURRENCY: ${{ vars.NVIDIA_AUDIT_CONCURRENCY || '1' }}
      PIPELINE_OUTPUT_ROOT: .validation-runs/current
      PIPELINE_STATE_ROOT: .validation-state
      PIPELINE_FORCE_FULL_AUDIT: ${{ vars.PIPELINE_FORCE_FULL_AUDIT || 'false' }}
      PIPELINE_DRY_RUN: ${{ vars.PIPELINE_DRY_RUN || 'true' }}
      PIPELINE_CREATE_PRS: ${{ vars.PIPELINE_CREATE_PRS || 'false' }}
      PIPELINE_AUDIT_ATTEMPTS: ${{ vars.PIPELINE_AUDIT_ATTEMPTS || '3' }}
      PIPELINE_PATCH_ATTEMPTS: ${{ vars.PIPELINE_PATCH_ATTEMPTS || '8' }}
      PIPELINE_PR_BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main input snapshot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Resolve execution policy
        shell: bash
        env:
          INPUT_FORCE_FULL_AUDIT: ${{ inputs.force_full_audit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CREATE_PRS: ${{ inputs.create_prs }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            {
              echo "PIPELINE_FORCE_FULL_AUDIT=false"
              echo "PIPELINE_DRY_RUN=false"
              echo "PIPELINE_CREATE_PRS=true"
            } >> "${GITHUB_ENV}"
          elif [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            {
              echo "PIPELINE_FORCE_FULL_AUDIT=false"
              echo "PIPELINE_DRY_RUN=true"
              echo "PIPELINE_CREATE_PRS=false"
            } >> "${GITHUB_ENV}"
          else
            {
              echo "PIPELINE_FORCE_FULL_AUDIT=${INPUT_FORCE_FULL_AUDIT}"
              echo "PIPELINE_DRY_RUN=${INPUT_DRY_RUN}"
              echo "PIPELINE_CREATE_PRS=${INPUT_CREATE_PRS}"
            } >> "${GITHUB_ENV}"
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for patch verification
        run: npx playwright install --with-deps chromium

      - name: Type-check the orchestrator
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Record the current frontend baseline
        id: frontend-baseline
        shell: bash
        run: |
          set +e
          npm run test:frontend
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" -ne 0 ]]; then
            echo "::warning::The current frontend baseline fails. The pipeline will continue so a grounded patch can repair it."
          fi
          exit 0

      - name: Prepare immutable validation-state worktree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin validation-state >/dev/null 2>&1; then
            git fetch origin validation-state:validation-state
            git worktree add .validation-state validation-state
          else
            git worktree add --detach .validation-state
            git -C .validation-state switch --orphan validation-state
            git -C .validation-state rm -rf . >/dev/null 2>&1 || true
            printf '%s\n' '# Secret MCP validation state' > .validation-state/README.md
          fi

      - name: Require the NVIDIA secret for live runs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NVIDIA_API_KEY}" ]]; then
            echo 'NVIDIA_API_KEY is not configured as an Actions secret.' >&2
            exit 1
          fi

      - name: Run isolated audit, patch guards, tests, and optional draft PR publication
        shell: bash
        env:
          DISPATCH_TRIGGER_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_path || '' }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${DISPATCH_TRIGGER_PATH}" ]]; then
            args+=(--trigger "${DISPATCH_TRIGGER_PATH}")
          fi
          npm run audit -- "${args[@]}"

      - name: Verify immutable inputs were not changed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- trigger DESIGN_INDEX_SPECIFICATION.md DESIGN_INDEX_SPECIFICATION.ko.md
          test -z "$(git status --porcelain -- trigger DESIGN_INDEX_SPECIFICATION.md DESIGN_INDEX_SPECIFICATION.ko.md)"

      - name: Upload audit and patch artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation-runs/current/**
            test-results/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  persist-state:
    name: Persist immutable validation state
    needs:
      - validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: design-validation-state-writer
      cancel-in-progress: false
    steps:
      - name: Check out main for state writer
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Download validation artifacts
        uses: actions/download-artifact@v8
        with:
          name: design-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .downloaded-validation

      - name: Prepare validation-state worktree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin validation-state >/dev/null 2>&1; then
            git fetch origin validation-state:validation-state
            git worktree add .validation-state validation-state
          else
            git worktree add --detach .validation-state
            git -C .validation-state switch --orphan validation-state
            git -C .validation-state rm -rf . >/dev/null 2>&1 || true
            printf '%s\n' '# Secret MCP validation state' > .validation-state/README.md
          fi

      - name: Commit immutable attestations and run records
        shell: bash
        run: |
          set -euo pipefail
          run_root='.downloaded-validation/.validation-runs/current'
          if [[ -d "${run_root}/attestations" ]]; then
            mkdir -p .validation-state/attestations
            cp -R "${run_root}/attestations/." .validation-state/attestations/
          fi
          if [[ -d "${run_root}/state-records" ]]; then
            mkdir -p .validation-state/runs
            cp -R "${run_root}/state-records/." .validation-state/runs/
          fi
          git -C .validation-state config user.name 'secret-mcp-validation[bot]'
          git -C .validation-state config user.email 'secret-mcp-validation[bot]@users.noreply.github.com'
          git -C .validation-state add -- README.md attestations runs 2>/dev/null || git -C .validation-state add -- README.md
          if ! git -C .validation-state diff --cached --quiet; then
            git -C .validation-state commit -m "state: record validation run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git -C .validation-state push origin HEAD:validation-state
          fi
